<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteador Oficial</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0284c7, #0f172a, #020617);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      max-width: 760px;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .btn-settings {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #475569;
      color: #94a3b8;
      font-size: 1.1rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-settings:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      transform: rotate(45deg);
    }

    .settings-panel {
      display: none;
      background: #090d16;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .settings-panel.active {
      display: block;
    }

    .settings-panel h3 {
      color: #38bdf8;
      font-size: 1rem;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.6), inset 0 0 10px rgba(56, 189, 248, 0.4);
      background: #000;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .controls-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      background: rgba(2, 6, 23, 0.7);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .controls-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .qty-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-qty {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-qty:hover {
      border-color: #38bdf8;
      color: #fff;
    }

    .btn-qty.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .winners-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .winners-grid.cols-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .winners-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    @media (max-width: 600px) {
      .winners-grid.cols-2, .winners-grid.cols-3 {
        grid-template-columns: 1fr;
      }
    }

    .roulette-box {
      background: #050b14;
      border: 2px solid #0284c7;
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      min-height: 115px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      box-shadow: inset 0 0 20px rgba(2, 132, 199, 0.2);
    }

    .roulette-box.spinning {
      border-color: #f59e0b;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4), inset 0 0 15px rgba(245, 158, 11, 0.2);
    }

    .roulette-box.winner {
      border-color: #22c55e;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.5), inset 0 0 15px rgba(34, 197, 94, 0.2);
      transform: scale(1.02);
    }

    .display-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #38bdf8;
      word-break: break-word;
    }

    .display-id {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
      word-break: break-all;
    }

    .winner-tag {
      background: #22c55e;
      color: #052e16;
      font-weight: 800;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      margin-bottom: 6px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .btn-draw {
      width: 100%;
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      transition: transform 0.1s ease, filter 0.2s ease;
    }

    .btn-draw:hover {
      filter: brightness(1.15);
    }

    .btn-draw:active {
      transform: scale(0.98);
    }

    .btn-draw:disabled {
      background: #334155;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .history-section {
      margin-top: 24px;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 16px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .btn-clear-history {
      background: transparent;
      border: 1px solid #64748b;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear-history:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .history-item {
      background: #090d16;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .history-item-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-item-winners {
      color: #38bdf8;
      font-weight: 600;
    }

    .history-item-time {
      font-size: 0.75rem;
      color: #64748b;
      white-space: nowrap;
    }

    .empty-history {
      color: #64748b;
      font-size: 0.85rem;
      text-align: center;
      padding: 8px 0;
    }

    .participants-section {
      margin-top: 24px;
    }

    .participants-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.95rem;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 12px;
      font-size: 0.85rem;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn-settings" onclick="toggleSettings()" title="Editar Título e Logo">⚙️</button>

    <div class="settings-panel" id="settingsPanel">
      <h3>⚙️ Configurações do Sorteio</h3>
      <div class="form-group">
        <label>Título Principal:</label>
        <input type="text" id="inputTitle" oninput="saveCustomConfig()">
      </div>
      <div class="form-group">
        <label>Subtítulo / Prêmio:</label>
        <input type="text" id="inputSubtitle" oninput="saveCustomConfig()">
      </div>
      <div class="form-group">
        <label>Caminho/URL da Logo:</label>
        <input type="text" id="inputLogo" oninput="saveCustomConfig()" placeholder="Ex: logo.png ou link da internet">
      </div>
    </div>

    <div class="logo-container">
      <img src="logo.png" alt="Logo Sorteio" class="logo-img" id="mainLogo">
    </div>

    <h1 id="mainTitle">Sorteio do GGeasy</h1>
    <p class="subtitle" id="mainSubtitle">Codiguin Punho + MP5</p>

    <div class="controls-wrapper">
      <span class="controls-label">Quantidade de Ganhadores:</span>
      <div class="qty-buttons">
        <button class="btn-qty active" onclick="setQty(1)">1</button>
        <button class="btn-qty" onclick="setQty(2)">2</button>
        <button class="btn-qty" onclick="setQty(3)">3</button>
      </div>
    </div>

    <div class="winners-grid" id="winnersContainer"></div>

    <button class="btn-draw" id="btnDraw" onclick="startDraw()">Sortear Agora</button>

    <div class="history-section">
      <div class="history-header">
        <span class="history-title">📜 Histórico de Sorteios</span>
        <button class="btn-clear-history" onclick="clearHistory()">Limpar Histórico</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="empty-history" id="emptyHistory">Nenhum sorteio realizado nesta sessão.</div>
      </div>
    </div>

    <div class="participants-section">
      <div class="participants-header">
        <span>Lista de Participantes (1 por linha)</span>
        <span id="counter">0 participantes</span>
      </div>
      <textarea id="rawList" placeholder="Cole sua lista de participantes aqui (1 por linha)...&#10;Exemplo:&#10;Jogador 1 – ID: 123456&#10;Jogador 2 – ID: 789101" oninput="handleListInput()"></textarea>
    </div>
  </div>

  <script>
    let currentQty = 1;
    let drawCounter = 0;

    const mainTitle = document.getElementById('mainTitle');
    const mainSubtitle = document.getElementById('mainSubtitle');
    const mainLogo = document.getElementById('mainLogo');
    const inputTitle = document.getElementById('inputTitle');
    const inputSubtitle = document.getElementById('inputSubtitle');
    const inputLogo = document.getElementById('inputLogo');
    const settingsPanel = document.getElementById('settingsPanel');
    const textarea = document.getElementById('rawList');
    const winnersContainer = document.getElementById('winnersContainer');
    const btnDraw = document.getElementById('btnDraw');
    const counter = document.getElementById('counter');
    const historyList = document.getElementById('historyList');
    const emptyHistory = document.getElementById('emptyHistory');

    function toggleSettings() {
      settingsPanel.classList.toggle('active');
    }

    function saveCustomConfig() {
      const titleVal = inputTitle.value.trim() || "Sorteio";
      const subtitleVal = inputSubtitle.value.trim() || "";
      const logoVal = inputLogo.value.trim() || "logo.png";

      mainTitle.innerText = titleVal;
      mainSubtitle.innerText = subtitleVal;
      mainLogo.src = logoVal;

      localStorage.setItem('draw_title', titleVal);
      localStorage.setItem('draw_subtitle', subtitleVal);
      localStorage.setItem('draw_logo', logoVal);
    }

    function loadCustomConfig() {
      const savedTitle = localStorage.getItem('draw_title') || "Sorteio do GGeasy";
      const savedSubtitle = localStorage.getItem('draw_subtitle') || "Codiguin Punho + MP5";
      const savedLogo = localStorage.getItem('draw_logo') || "logo.png";
      const savedList = localStorage.getItem('draw_list') || "";

      mainTitle.innerText = savedTitle;
      mainSubtitle.innerText = savedSubtitle;
      mainLogo.src = savedLogo;

      inputTitle.value = savedTitle;
      inputSubtitle.value = savedSubtitle;
      inputLogo.value = savedLogo;

      textarea.value = savedList;
      updateCounter();
    }

    function handleListInput() {
      updateCounter();
      localStorage.setItem('draw_list', textarea.value);
    }

    function getItems() {
      return textarea.value.split('\n').map(i => i.trim()).filter(i => i.length > 0);
    }

    function updateCounter() {
      const items = getItems();
      counter.innerText = `${items.length} participantes`;
    }

    function parseParticipant(text) {
      const parts = text.split(/[-–]/);
      if (parts.length > 1) {
        return { name: parts[0].trim(), id: parts.slice(1).join('-').trim() };
      }
      return { name: text, id: '' };
    }

    function renderSlots(qty) {
      winnersContainer.className = `winners-grid ${qty > 1 ? 'cols-' + qty : ''}`;
      winnersContainer.innerHTML = '';

      for (let i = 1; i <= qty; i++) {
        const box = document.createElement('div');
        box.className = 'roulette-box';
        box.id = `box-${i}`;
        box.innerHTML = `
          <span class="winner-tag" id="badge-${i}" style="display: none;">🎉 Ganhador #${i} 🎉</span>
          <div class="display-name" id="name-${i}">Pronto (#${i})</div>
          <div class="display-id" id="id-${i}">Aguardando sorteio...</div>
        `;
        winnersContainer.appendChild(box);
      }
    }

    function setQty(qty) {
      currentQty = qty;
      document.querySelectorAll('.btn-qty').forEach((btn, index) => {
        btn.classList.toggle('active', index + 1 === qty);
      });
      renderSlots(qty);
    }

    function addHistoryEntry(winners) {
      drawCounter++;
      if (emptyHistory) emptyHistory.style.display = 'none';

      const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const item = document.createElement('div');
      item.className = 'history-item';

      const winnerText = winners.map(w => `${w.name} (${w.id || 'Sem ID'})`).join(' • ');

      item.innerHTML = `
        <div class="history-item-details">
          <span style="font-size: 0.75rem; color: #94a3b8; font-weight: 700;">RODADA #${drawCounter} (${winners.length} GANHADOR${winners.length > 1 ? 'ES' : ''})</span>
          <span class="history-item-winners">🏆 ${winnerText}</span>
        </div>
        <span class="history-item-time">${time}</span>
      `;

      historyList.prepend(item);
    }

    function clearHistory() {
      historyList.innerHTML = '<div class="empty-history" id="emptyHistory">Nenhum sorteio realizado nesta sessão.</div>';
      drawCounter = 0;
    }

    function startDraw() {
      const items = getItems();
      if (items.length < currentQty) {
        alert(`A lista precisa de pelo menos ${currentQty} participante(s) para realizar o sorteio!`);
        return;
      }

      btnDraw.disabled = true;

      for (let i = 1; i <= currentQty; i++) {
        document.getElementById(`badge-${i}`).style.display = 'none';
        const box = document.getElementById(`box-${i}`);
        box.classList.remove('winner');
        box.classList.add('spinning');
      }

      const shuffled = [...items].sort(() => 0.5 - Math.random());
      const selectedWinners = shuffled.slice(0, currentQty).map(parseParticipant);

      function spinSlot(idx) {
        const box = document.getElementById(`box-${idx}`);
        const nameEl = document.getElementById(`name-${idx}`);
        const idEl = document.getElementById(`id-${idx}`);
        const badgeEl = document.getElementById(`badge-${idx}`);

        const duration = idx === 1 ? 2800 : 2000;
        const speed = 50;
        const start = Date.now();

        const interval = setInterval(() => {
          const randomItem = parseParticipant(items[Math.floor(Math.random() * items.length)]);
          nameEl.innerText = randomItem.name;
          idEl.innerText = randomItem.id;

          if (Date.now() - start >= duration) {
            clearInterval(interval);

            const winner = selectedWinners[idx - 1];
            nameEl.innerText = winner.name;
            idEl.innerText = winner.id;
            badgeEl.style.display = 'inline-block';
            box.classList.remove('spinning');
            box.classList.add('winner');

            confetti({
              particleCount: 80,
              spread: 60,
              origin: { y: 0.6 }
            });

            if (idx < currentQty) {
              spinSlot(idx + 1);
            } else {
              addHistoryEntry(selectedWinners);
              btnDraw.disabled = false;
            }
          }
        }, speed);
      }

      spinSlot(1);
    }

    loadCustomConfig();
    renderSlots(1);
  </script>
</body>
</html>
