<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteio do GGeasy - Codiguin FF</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: radial-gradient(circle at top, #0284c7, #0f172a, #020617); color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
    .container { max-width: 760px; width: 100%; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(56, 189, 248, 0.25); backdrop-filter: blur(14px); border-radius: 18px; padding: 28px; box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6); }
    .tabs-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .tab-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .logo-container { width: 100%; display: flex; justify-content: center; margin-bottom: 12px; }
    .logo-img { width: 110px; height: 110px; object-fit: cover; border-radius: 50%; border: 3px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }
    h1 { text-align: center; color: #38bdf8; font-size: 1.7rem; text-transform: uppercase; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
    
    /* Checklist Style */
    .checklist-container { background: #090d16; border: 1px solid #334155; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .check-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.85rem; cursor: pointer; }
    .check-item input { width: 18px; height: 18px; cursor: pointer; accent-color: #0284c7; }

    .social-links-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; margin-bottom: 15px; }
    .social-btn { display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: 700; color: white; }
    .btn-insta { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
    .btn-yt { background: #ef4444; }
    .btn-tiktok { background: #000; border: 1px solid #334155; }
    
    .form-box { background: rgba(2, 6, 23, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .input-group label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
    .input-group input { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 8px; }
    .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 8px; color: white; font-weight: 800; cursor: pointer; }
    
    .admin-tools { margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid #334155; }
    .btn-action-small { background: #ef4444; border: none; color: white; padding: 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; margin: 4px; }
    .participants-list-box { background: #000; padding: 10px; border-radius: 8px; border: 1px solid #334155; max-height: 250px; overflow-y: auto; margin-top: 10px; }
    .participant-item { padding: 8px; border-bottom: 1px solid #1e293b; font-size: 0.85rem; display: flex; justify-content: space-between; }
    .roulette-box { background: #050b14; border: 2px solid #0284c7; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 10px; }
    .winners-grid { display: grid; gap: 10px; margin-bottom: 20px; }
    .btn-draw { width: 100%; padding: 15px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 10px; color: white; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <div class="tabs-nav">
      <button class="tab-btn active" id="tabRegisterBtn" onclick="switchTab('register')">📝 Inscrição</button>
      <button class="tab-btn" id="tabDrawBtn" onclick="switchTab('draw')">🎰 Painel Admin</button>
    </div>

    <div class="logo-container"><img src="logo.png" alt="Logo" class="logo-img"></div>
    <h1>Sorteio do GGeasy</h1>

    <div id="sectionRegister">
      <div class="social-links-grid">
        <a href="https://www.instagram.com/ggeasy" class="social-btn btn-insta">📸 Insta</a>
        <a href="https://www.youtube.com/@GGeasyYT" class="social-btn btn-yt">▶️ YT</a>
        <a href="https://www.tiktok.com/@ggeasyoficial_" class="social-btn btn-tiktok">🎵 TikTok</a>
      </div>

      <form class="form-box" onsubmit="handleRegistration(event)">
        <div class="input-group"><label>Nick:</label><input type="text" id="regName" required></div>
        <div class="input-group"><label>ID:</label><input type="number" id="regId" required></div>
        <div class="input-group"><label>WhatsApp:</label><input type="tel" id="regPhone" required></div>
        
        <div class="checklist-container">
          <label class="check-item"><input type="checkbox" id="c1" required> Segui no Instagram @ggeasy</label>
          <label class="check-item"><input type="checkbox" id="c2" required> Segui no YouTube @GGeasyYT</label>
          <label class="check-item"><input type="checkbox" id="c3" required> Segui no TikTok @ggeasyoficial_</label>
          <label class="check-item"><input type="checkbox" id="c4" required> Estou no grupo do WhatsApp</label>
        </div>

        <button type="submit" class="btn-submit">Confirmar Participação</button>
      </form>
    </div>

    <div id="sectionDraw" style="display: none;">
      <div class="winners-grid" id="winnersContainer"></div>
      <button class="btn-draw" id="btnDraw" onclick="startDraw()">Sortear Agora</button>
      
      <div class="admin-tools">
        <h4>👥 Inscritos (<span id="dbCounter">0</span>)</h4>
        <div class="participants-list-box" id="participantsListContainer"></div>
        <button class="btn-action-small" onclick="clearDatabase()">🗑️ Zerar Banco</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCl9L87mI-lb4lD1FeilBW0s0caOKYjeDU",
      authDomain: "sorteio-ggeasy.firebaseapp.com",
      databaseURL: "https://sorteio-ggeasy-default-rtdb.firebaseio.com",
      projectId: "sorteio-ggeasy",
      storageBucket: "sorteio-ggeasy.firebasestorage.app",
      messagingSenderId: "502362048213",
      appId: "1:502362048213:web:a67341ed7991045226845c",
      measurementId: "G-LYSVC0WYH3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let participantsList = [];

    db.ref('participants').on('value', (s) => {
      const data = s.val();
      participantsList = data ? Object.values(data) : [];
      document.getElementById('dbCounter').innerText = participantsList.length;
      const container = document.getElementById('participantsListContainer');
      container.innerHTML = '';
      participantsList.forEach(p => {
        container.innerHTML += `<div class="participant-item"><span>${p.name}</span> <span>ID: ${p.id}</span></div>`;
      });
    });

    function switchTab(tab) {
      if (tab === 'draw' && prompt("Senha:") !== "ggeasy123") return alert("Senha incorreta!");
      document.getElementById('sectionRegister').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('sectionDraw').style.display = tab === 'draw' ? 'block' : 'none';
    }

    function handleRegistration(e) {
      e.preventDefault();
      const p = { name: document.getElementById('regName').value, id: document.getElementById('regId').value, phone: document.getElementById('regPhone').value };
      if(participantsList.some(x => x.id === p.id)) return alert("ID já cadastrado!");
      db.ref('participants').push(p).then(() => {
        alert("Inscrição confirmada!");
        // Limpa campos e desmarca checkboxes
        document.getElementById('regName').value = '';
        document.getElementById('regId').value = '';
        document.getElementById('regPhone').value = '';
        ['c1','c2','c3','c4'].forEach(id => document.getElementById(id).checked = false);
      });
    }

    function clearDatabase() {
      if (!confirm("Zerar tudo?")) return;
      db.ref('participants').remove();
    }

    function startDraw() {
      if (participantsList.length === 0) return alert("Banco vazio!");
      const w = participantsList[Math.floor(Math.random() * participantsList.length)];
      alert("GANHADOR: " + w.name + "\nID: " + w.id);
    }
  </script>
</body>
</html>
